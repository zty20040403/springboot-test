spring:
  application:
    name: spring-quickstart
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:mybatis_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zhu.springquickstart.entity
  configuration:
    map-underscore-to-camel-case: true
